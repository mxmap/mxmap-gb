version: '3.3'
services:
  scanmuni:
    build:
      context: ./scanner
    tmpfs:
      - /tmp:size=1G
    volumes:
      - ./scanner/scanner-result:/app/scanner-result
      - ./scanner/scanner-input:/app/scanner-input
    hostname: de.mail-sicherheit-test.de
    environment:
      LOG_LEVEL: INFO
      INPUT_FILE:
      DNS_NAMESERVER: 8.8.8.8
      DNS_QUERIES_PER_SECOND: 1.0
      DNS_THREAD_MULTIPLIER: 2
      TESTSSL_STARTTLS_SLEEP: 60
      TESTSSL_CONNECT_TIMEOUT: 30s
      TESTSSL_OPENSSL_TIMEOUT: 30s
      SCAN_THREAD_MULTIPLIER: 2
      DANE_RETRIES: 2
      DANE_TRIES_PER_SECOND: 0.25
      DANE_TIMEOUT: 300
      TLS_RETRIES: 2
      TLS_TRIES_PER_SECOND: 0.25
      TLS_TIMEOUT: 300
      DSS_TRIES_PER_SECOND: 4.0
      DATASET_DELAY_MINUTES: 0

  evalmuni:
    build:
      context: ./evaluator
    volumes:
      - ./evaluator/evaluator-input:/app/evaluator-input
      - ./evaluator/evaluator-result:/app/evaluator-result
    environment:
      LOG_LEVEL: INFO

  unbound:
    image: mvance/unbound:latest
    #container_name: local-resolver

    volumes:
      # Mappt config in den Container (ro = read only)
      - ./scanner/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf