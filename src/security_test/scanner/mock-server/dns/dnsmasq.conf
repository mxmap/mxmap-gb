# Leite unbekannte Anfragen an den internen Docker-DNS weiter (für externe Domains)
server=127.0.0.11

# ==========================================
# Domain 1: domain1.de
# ==========================================

address=/domain1.de/10.5.0.3
mx-host=domain1.de,mail.domain1.de,10
txt-record=_dmarc.domain1.de,"v=DMARC1; p=reject; rua=mailto:dmarc@domain1.de, mailto:dmarc@domain3.de; ruf=mailto:dmarc@domain2.de, mailto:dmarc@domain4.de"


# ==========================================
# Domain 2: domain2.de
# ==========================================

address=/domain2.de/10.5.0.3
mx-host=domain2.de,mail.domain2.de,10
txt-record=_dmarc.domain2.de,"v=DMARC1; p=D;"
txt-record=domain1.de._report._dmarc.domain3.de,"v=D;"

# ==========================================
# Domain 3: domain3.de
# ==========================================

address=/domain3.de/10.5.0.3
mx-host=domain3.de,mail.domain3.de,10
txt-record=_dmarc.domain3.de,"v=DMARC1; p=none; sp=reject;"
txt-record=domain1.de._report._dmarc.domain3.de,"v=DMARC1;"

# ==========================================
# Domain 3: subdomain.domain3.de
# ==========================================

address=/subdomain.domain3.de/10.5.0.3
mx-host=domain3.de,mail.domain3.de,10


# ==========================================
# Domain 4: domain4.de
# ==========================================

address=/domain3.de/10.5.0.3
mx-host=domain3.de,mail.domain3.de,10
txt-record=domain3.de,"v=DMARC1; p=none; sp=reject;"

