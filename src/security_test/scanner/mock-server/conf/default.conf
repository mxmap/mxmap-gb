server {
    listen 443 ssl;
    server_name _;

    # Angepasste Pfade für das neue Zertifikats-Verzeichnis
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location /.well-known/ {
        root /usr/share/nginx/html;
        default_type text/plain;
    }
}